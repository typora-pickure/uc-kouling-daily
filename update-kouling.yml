name: Update kouling

on:
  workflow_dispatch:
  schedule:
    # 00:20 Asia/Shanghai every day.
    - cron: "20 16 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Fetch kouling
        run: npm run fetch

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update kouling"
          file_pattern: "latest.txt index.html package-lock.json"
